name: Windows local i proves sense credencials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      GARMIN_API_KEY: ''
      GRA_DATA_DIR: ${{ github.workspace }}/private/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m garmin_running.desktop.launcher --diagnose
      - name: Instal·lador Windows (sense obrir navegador ni crear accessos)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'gra-install-profile'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          Remove-Item Env:GRA_DATA_DIR -ErrorAction SilentlyContinue
          & ./windows/Install.ps1 -NoShortcut -NoLaunch
